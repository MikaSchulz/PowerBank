# Connections to the local stack from compose.yaml. You start and stop it yourself: docker compose up -d --wait
# (stop: docker compose down). In other environments, override these with environment variables, e.g.
# SPRING_DATASOURCE_URL.
spring:
  application:
    name: bank-a   # service.name in the telemetry; bank B is bank-b (application-bank-b.yml)
  datasource:
    url: jdbc:postgresql://localhost:5432/bank
    username: bank
    password: bank   # local only, as in compose.yaml
  flyway:
    placeholders:
      bankCode: ${bank.identity.bank-code}   # IBANs of existing accounts (V6)
  temporal:
    connection:
      # Not "local": with that shortcut the Temporal SDK reports no metrics (temporal_*) in this setup.
      target: localhost:7233
    namespace: default
    workers-auto-discovery:
      packages:
        - com.example.bank

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0   # learning project: trace every request
  # OTLP/HTTP to the collector in the Grafana LGTM container
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    distribution:
      # Histogram buckets for our own timers and HTTP, so the dashboard can show percentiles (Temporal's timers
      # have them already).
      percentiles-histogram:
        bank: true
        http.server.requests: true

jdbc:
  datasource-proxy:
    include-parameter-values: false   # SQL in spans, but never the bound values (personal data)

bank:
  identity:   # bank A; bank B in application-bank-b.yml. Made-up codes: 99… is not assigned to real banks.
    name: PowerBank
    bic: PWRBDEFFXXX
    bank-code: "99000001"
  clearing:
    url: http://localhost:8090   # the clearing house (#58); in compose: http://clearing:8090
  risk:
    review-threshold-cents: 1000000          # manual approval from 10,000 €
    external-review-threshold-cents: 500000  # to external banks from 5,000 €
  external-bank:
    min-delay: 1s
    max-delay: 4s
    rejection-rate: 0.2
    failure-rate: 0.1
