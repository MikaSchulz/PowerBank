# detekt rules on top of the defaults (buildUponDefaultConfig). Only deviations are listed here.
# Deliberate exceptions in the code carry a @Suppress with a comment that says why.

complexity:
  TooManyFunctions:
    ignorePrivate: true   # small private helpers keep classes readable and shouldn't count against them
    excludes: ['**/test/**', '**/integrationTest/**']

style:
  MaxLineLength:
    maxLineLength: 140   # same as ktlint (build.gradle.kts)
  MagicNumber:
    ignorePropertyDeclaration: true   # e.g. activity timeouts in the workflow, named by the property
    excludes: ['**/test/**', '**/integrationTest/**']   # amounts in tests are the test data
  ReturnCount:
    max: 4                       # early returns are idiomatic Kotlin and keep the happy path unindented
    excludeGuardClauses: true

naming:
  FunctionNaming:
    excludes: ['**/test/**', '**/integrationTest/**']   # test names in backticks
