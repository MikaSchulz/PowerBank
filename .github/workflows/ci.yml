name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # JDK 25 for the Gradle toolchain (javaVersion=25 in gradle.properties)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and validates the wrapper
      - uses: gradle/actions/setup-gradle@v6

      # The vendored OpenTelemetry bundle for the browser must match package-lock.json (esbuild builds it reproducibly)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bank-service/src/main/ui-telemetry/package-lock.json
      - name: Check the vendored browser telemetry bundle
        working-directory: bank-service/src/main/ui-telemetry
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../resources/static/vendor/otel-web.js

      # Compile and unit tests (domain, workflow, ArchUnit, web slices): no containers
      - run: ./gradlew build

      # Integration tests against the local stack from compose.yaml (Grafana LGTM isn't needed for them)
      - name: Start Postgres and Temporal
        run: docker compose up -d --wait postgres temporal
      - run: ./gradlew integrationTest
      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 7

  # The showcase (docs/showcase.md): builds the bank-service image, starts everything with demo traffic and checks
  # that transfers get booked and the ledger stays balanced. Runs next to the build job, not before it.
  showcase:
    name: Showcase (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the showcase
        run: docker compose --profile showcase up -d --build --wait

      - name: Smoke test
        run: |
          sleep 30
          curl -fsS localhost:8080/api/ledger/summary | python3 -c '
          import json, sys
          summary = json.load(sys.stdin)
          print(summary)
          assert summary["transferCount"] > 0, "the demo traffic booked nothing"
          assert summary["sumOfAllPostingsCents"] == 0, "the ledger is unbalanced"
          '

      - name: Logs
        if: failure()
        run: docker compose --profile showcase logs --no-color bank-service clearing traffic | tail -n 200

      - name: Stop
        if: always()
        run: docker compose --profile showcase down -v
