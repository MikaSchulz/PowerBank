# PowerBank alert rules (Grafana-managed), provisioned into the folder "PowerBank". Mounted into the
# grafana/otel-lgtm container by compose.yaml; changes need a container restart.
#
# Every rule has a query A and a threshold C. Rules return "no data" while the bank-service isn't running or there
# is no traffic; that counts as OK. Notifications aren't configured yet: firing alerts show up under
# Alerting → Alert rules and on the dashboard "PowerBank overview".
apiVersion: 1

groups:
  - orgId: 1
    name: PowerBank
    folder: PowerBank
    interval: 30s
    rules:
      - uid: powerbank-ledger-unbalanced
        title: Ledger unbalanced
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: abs(sum(bank_ledger_sum_cents))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: The sum of all postings is not 0.
          description: >-
            Double-entry bookkeeping is broken: the postings sum up to {{ $values.A.Value }} cents instead of 0.
            Every transfer must sum up to zero. Find the one that doesn't:
            SELECT transfer_id, SUM(amount_cents) FROM postings GROUP BY transfer_id HAVING SUM(amount_cents) <> 0
          __dashboardUid__: powerbank-overview
          __panelId__: "2"

      - uid: powerbank-clearing-house-failing
        title: Clearing house not reachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Share of calls that failed technically, only with at least 5 calls in 5 minutes.
              expr: >-
                (sum(increase(bank_clearing_call_milliseconds_count{outcome="failure"}[5m]))
                  / sum(increase(bank_clearing_call_milliseconds_count[5m])))
                and on() (sum(increase(bank_clearing_call_milliseconds_count[5m])) >= 5)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: More than half of the calls to the clearing house failed in the last 5 minutes.
          description: >-
            {{ humanizePercentage $values.A.Value }} of the pacs.008 and pacs.028 calls failed. Temporal retries them;
            payments without a final status go under investigation after 5 minutes. Is the clearing house running?
          __dashboardUid__: powerbank-overview
          __panelId__: "13"

      - uid: powerbank-refund-rate
        title: Many external transfers refunded
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Share of finished external transfers that were refunded, only with at least 5 of them in 15 minutes.
              expr: >-
                (sum(increase(bank_transfers_finished_total{kind="external", status="REFUNDED"}[15m]))
                  / sum(increase(bank_transfers_finished_total{kind="external"}[15m])))
                and on() (sum(increase(bank_transfers_finished_total{kind="external"}[15m])) >= 5)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.3] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: More than 30 % of the external transfers in the last 15 minutes were refunded.
          description: "{{ humanizePercentage $values.A.Value }} of the finished external transfers were refunded."
          __dashboardUid__: powerbank-overview
          __panelId__: "13"

      - uid: powerbank-approval-waiting
        title: Transfer waiting for approval for over a day
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(bank_transfers_in_flight_age_max_seconds{status="AWAITING_APPROVAL"})
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [86400] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: A transfer has been waiting for an approval for more than a day.
          description: >-
            One transfer has been awaiting approval for {{ humanizeDuration $values.A.Value }}. Transfers above the
            limit wait for up to 3 days and are rejected afterwards; approve or deny it in the UI.
          __dashboardUid__: powerbank-overview
          __panelId__: "4"

      - uid: powerbank-external-transfer-stuck
        title: External transfer stuck
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(bank_transfers_in_flight_age_max_seconds{status=~"RESERVED|SENT_TO_EXTERNAL_BANK"})
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [900] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: An external transfer has been reserved or sent for more than 15 minutes.
          description: >-
            The workflow puts a transfer under investigation after 5 minutes without a final status, so after
            {{ humanizeDuration $values.A.Value }} something is wrong: is the worker running?
          __dashboardUid__: powerbank-overview
          __panelId__: "4"

      - uid: powerbank-transfer-under-investigation
        title: External transfer under investigation
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(bank_transfers_in_flight{status="UNDER_INVESTIGATION"})
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: External transfers have no final status from the clearing house.
          description: >-
            {{ $values.A.Value }} transfer(s) under investigation: their amount stays reserved until the clearing house
            confirms or answers a status inquiry. The workflow keeps asking every 10 minutes; check the clearing house.
          __dashboardUid__: powerbank-overview
          __panelId__: "3"

      - uid: powerbank-transfer-stuck-before-booking
        title: Transfer stuck before booking
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Received or approved transfers are booked within seconds; nothing is booked for them yet.
              expr: max(bank_transfers_in_flight_age_max_seconds{status=~"RECEIVED|APPROVED"})
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [900] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: A transfer has been received or approved for more than 15 minutes without being booked.
          description: >-
            One transfer has been waiting {{ humanizeDuration $values.A.Value }} for its next step. Is the worker
            running, and does its workflow still exist in Temporal (#40)?
          __dashboardUid__: powerbank-overview
          __panelId__: "4"

      - uid: powerbank-worker-backlog
        title: Temporal workers can't keep up
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # p95 schedule-to-start latency, one series per task kind.
              expr: >-
                histogram_quantile(0.95, sum by (le, task) (
                  label_replace(rate(temporal_workflow_task_schedule_to_start_latency_milliseconds_bucket[5m]), "task", "workflow task", "", "")
                  or
                  label_replace(rate(temporal_activity_schedule_to_start_latency_milliseconds_bucket[5m]), "task", "activity", "", "")
                ))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.task }}s wait more than 1 s in the task queue (p95)."
          description: >-
            Schedule-to-start p95 is {{ humanize $values.A.Value }} ms: the workers are too slow or have too few
            slots. Compare with "Task slots in use" on the dashboard.
          __dashboardUid__: powerbank-overview
          __panelId__: "16"

      - uid: powerbank-api-server-errors
        title: REST API returns server errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (method, uri) (increase(http_server_requests_milliseconds_count{status=~"5.."}[5m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.method }} {{ $labels.uri }} answered with 5xx in the last 5 minutes."
          description: Look for the errors in the logs panel of the dashboard or in Loki with severity_text="ERROR".
          __dashboardUid__: powerbank-overview
          __panelId__: "22"

      - uid: powerbank-browser-errors
        title: JavaScript errors in the UI
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: sum(count_over_time({service_name="bank-ui"} | severity_text="ERROR" [5m]))
              queryType: instant
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: The UI reported {{ $values.A.Value }} JavaScript errors or failed actions in the last 5 minutes.
          description: The log records carry the stack trace and, for failed actions, the trace ID of the action.
          __dashboardUid__: powerbank-overview
          __panelId__: "28"

      # --- Infrastructure (observability/otel-collector) ---------------------------------------------------------

      - uid: powerbank-temporal-server-down
        title: Temporal server down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(up{job="temporal-server"})
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The Temporal server doesn't answer.
          description: >-
            No transfer can be started, approved or finished while the Temporal server is down. Running transfers
            continue once it is back (their state is on the temporal-data volume).
          __dashboardUid__: powerbank-infrastructure
          __panelId__: "2"

      - uid: powerbank-task-queue-stuck
        title: Nobody works on the bank task queue
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Measured by the server, so it also fires when the bank-service (the worker) is down completely.
              expr: max by (task_type) (approximate_backlog_age_seconds{taskqueue="bank"})
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [60] }
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.task_type }} tasks have been waiting in the bank task queue for {{ humanizeDuration $values.A.Value }}."
          description: No worker picks them up. Is the bank-service running and connected to Temporal?
          __dashboardUid__: powerbank-infrastructure
          __panelId__: "5"

      - uid: powerbank-temporal-persistence-errors
        title: Temporal server can't reach its database
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Only real trouble: ConditionFailed (e.g. a duplicate start) and NotFound are part of normal operation.
              expr: sum(increase(persistence_error_with_type_total{error_type=~".*(Unavailable|Timeout|DeadlineExceeded|Internal).*"}[5m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: The Temporal server had persistence errors in the last 5 minutes.
          description: Check the Temporal server logs on the infrastructure dashboard.
          __dashboardUid__: powerbank-infrastructure
          __panelId__: "12"

      - uid: powerbank-postgres-unreachable
        title: Postgres unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # The database size can only be read with a connection; the series disappears within a minute.
              expr: (count(postgresql_db_size_bytes) > bool 0) or vector(0)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The collector gets no metrics from Postgres.
          description: >-
            Postgres is down or refuses the connection. Without it, no booking is possible; Temporal retries the
            activities until it is back.
          __dashboardUid__: powerbank-infrastructure
          __panelId__: "3"

      - uid: powerbank-postgres-connections
        title: Postgres connections almost used up
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(postgresql_backends) / max(postgresql_connection_max)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ humanizePercentage $values.A.Value }} of max_connections are in use."
          description: New connections will be refused soon. Look for connection leaks or too large pools.
          __dashboardUid__: powerbank-infrastructure
          __panelId__: "6"

      - uid: powerbank-postgres-deadlocks
        title: Postgres deadlocks
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(postgresql_deadlocks_total[10m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: Postgres resolved a deadlock in the last 10 minutes.
          description: >-
            The ledger locks accounts sorted by ID to avoid deadlocks, so this points to a new code path that locks
            in a different order. The Postgres log has the details.
          __dashboardUid__: powerbank-infrastructure
          __panelId__: "25"
