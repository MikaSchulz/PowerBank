[versions]
kotlin = "2.3.21"
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
temporal = "1.40.0"
fmodel = "3.7.0"
junit = "6.0.3"
coroutines = "1.10.2"

[libraries]
temporal-starter   = { module = "io.temporal:temporal-spring-boot-starter", version.ref = "temporal" }
temporal-kotlin    = { module = "io.temporal:temporal-kotlin", version.ref = "temporal" }
temporal-testing   = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
fmodel-domain      = { module = "com.fraktalio.fmodel:domain", version.ref = "fmodel" }
fmodel-application = { module = "com.fraktalio.fmodel:application-vanilla", version.ref = "fmodel" }
junit-bom          = { module = "org.junit:junit-bom", version.ref = "junit" }
coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

[plugins]
kotlin-jvm                 = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring              = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot                = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
