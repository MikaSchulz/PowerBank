# The local stack. You start and stop it yourself; the app no longer does:
#   docker compose up -d --wait    (or ./gradlew composeUp)
#   docker compose down            (or ./gradlew composeDown; add -v to reset ledger and workflows together)
# The health checks let --wait return only when Postgres and Temporal accept connections.
# Image versions are pinned; Dependabot proposes updates as pull requests.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank   # local only
    # JSON logs into a file the collector reads (observability/otel-collector). They must not contain personal data:
    # no statement parameters and no statement after errors. jsonlog still writes DETAIL (e.g. a failing row), so
    # the collector passes on only a few safe fields. Slow statements (from 250 ms) and lock waits (from 1 s) are
    # logged; the app's statements only have $1 placeholders. One file per weekday.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_file_mode=0644
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bank", "-d", "bank"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-logs:/var/log/postgresql
  temporal:
    image: temporalio/temporal:1.9.1   # CLI 1.9.1 with server 1.32.0
    # --db-filename: the dev server keeps workflows in SQLite on a volume instead of in memory, so running
    # transfers survive a restart. Ledger (Postgres) and workflows (Temporal) belong together: reset both at once
    # with `docker compose down -v`, never only one of them. Namespaces keep workflows apart: default for bank A,
    # bank-b for the second bank (#57), clearing for the clearing house (#58), integration-test for the tests.
    # The server logs only to stdout; a pipe copies its JSON output to a file the collector reads. `exec` keeps the
    # server as the main process, so it still shuts down cleanly on `docker compose stop`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /home/temporal/logs
        rm -f /tmp/log.pipe && mkfifo /tmp/log.pipe
        tee -a /home/temporal/logs/temporal.log < /tmp/log.pipe &
        exec temporal server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db \
          --namespace bank-b --namespace clearing --namespace integration-test --metrics-port 9233 --log-format json > /tmp/log.pipe 2>&1
    ports: ["7233:7233", "8233:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - temporal-data:/home/temporal   # the image's user may only write here
  # Grafana with Tempo (traces), Loki (logs) and Prometheus (metrics) in one container.
  # The bank-service sends OTLP traces, metrics and logs to localhost:4318 (application.yml).
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    environment:
      PROMETHEUS_EXTRA_ARGS: --enable-feature=created-timestamp-zero-ingestion
      # Infrastructure telemetry: Temporal server and Postgres metrics and logs (observability/otel-collector)
      OTELCOL_EXTRA_ARGS: --config=file:/otel-lgtm/powerbank-infrastructure.yaml
      POSTGRES_MONITOR_USER: bank       # local only; in production a role with only pg_monitor
      POSTGRES_MONITOR_PASSWORD: bank
    volumes:
      # PowerBank dashboard and alert rules (observability/grafana), loaded on every start
      - ./observability/grafana/provisioning/dashboards/powerbank.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/powerbank.yaml:ro
      - ./observability/grafana/provisioning/alerting/powerbank.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/powerbank.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/powerbank-dashboards:ro
      - ./observability/otel-collector/infrastructure.yaml:/otel-lgtm/powerbank-infrastructure.yaml:ro
      # log files of Postgres and the Temporal server, read-only
      - postgres-logs:/var/log/powerbank/postgres:ro
      - temporal-data:/var/log/powerbank/temporal:ro

  # --- Showcase: the whole system without a local Java, with demo traffic (docs/showcase.md) -------------------------
  #   docker compose --profile showcase up -d --build --wait     (or ./gradlew showcaseUp)
  #   docker compose --profile showcase down                     (or ./gradlew composeDown)
  # Don't run it next to ./gradlew :bank-service:bootRun: both use port 8080.
  bank-service:
    profiles: [showcase]
    build:
      context: .
      dockerfile: Dockerfile
    image: powerbank/bank-service:local
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank
      SPRING_TEMPORAL_CONNECTION_TARGET: temporal:7233
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
    healthcheck:
      # the JRE image has bash but no curl: a plain HTTP request over /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      lgtm:
        condition: service_started
  traffic:
    profiles: [showcase]
    image: python:3.13-alpine
    command: ["python", "-u", "/traffic.py"]
    environment:
      BANK_URL: http://bank-service:8080
    volumes:
      - ./showcase/traffic.py:/traffic.py:ro
    depends_on:
      bank-service:
        condition: service_healthy

  # --- Bank B: the same bank-service as a second, separate bank (#55, application-bank-b.yml) -----------------------
  #   docker compose --profile bank-b up -d --build --wait    UI: http://localhost:8081
  # Its own Postgres schema (bank_b) and Temporal namespace (bank-b), next to bank A in the same containers.
  # For development, bootRun works too: ./gradlew :bank-service:bootRun --args='--spring.profiles.active=bank-b'
  bank-b:
    profiles: [bank-b]
    build:
      context: .
      dockerfile: Dockerfile
    image: powerbank/bank-service:local
    ports: ["8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: bank-b
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank?currentSchema=bank_b
      SPRING_TEMPORAL_CONNECTION_TARGET: temporal:7233
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      lgtm:
        condition: service_started

  # --- Clearing house: between the banks, like a SEPA Instant CSM (#58) ---------------------------------------------
  #   docker compose --profile clearing up -d --build --wait    API: http://localhost:8090/api/clearing
  # Its own Postgres schema (clearing) and Temporal namespace (clearing). It reaches the banks on the host: bank A
  # (bootRun, port 8080) and bank B (port 8081). For development: ./gradlew :clearing:bootRun
  clearing:
    profiles: [clearing]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: clearing
    image: powerbank/clearing:local
    ports: ["8090:8090"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank?currentSchema=clearing
      SPRING_TEMPORAL_CONNECTION_TARGET: temporal:7233
      # The whole participant list: a list from another source replaces the one in application.yml.
      CLEARING_PARTICIPANTS_0_BANKCODE: "99000001"
      CLEARING_PARTICIPANTS_0_BIC: PWRBDEFFXXX
      CLEARING_PARTICIPANTS_0_URL: http://host.docker.internal:8080
      CLEARING_PARTICIPANTS_1_BANKCODE: "99000002"
      CLEARING_PARTICIPANTS_1_BIC: PTNRDEFFXXX
      CLEARING_PARTICIPANTS_1_URL: http://host.docker.internal:8081
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      lgtm:
        condition: service_started

  # later for stage 9: hashicorp/vault in dev mode

volumes:
  postgres-data:
  postgres-logs:
  temporal-data:
