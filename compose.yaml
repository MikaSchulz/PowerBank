services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank   # local only
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
  temporal:
    image: temporalio/temporal:latest
    # --db-filename: the dev server keeps workflows in SQLite on a volume instead of in memory, so running
    # transfers survive a restart. Ledger (Postgres) and workflows (Temporal) belong together: reset both at once
    # with `docker compose down -v`, never only one of them.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes:
      - temporal-data:/home/temporal   # the image's user may only write here
  # Grafana with Tempo (traces), Loki (logs) and Prometheus (metrics) in one container.
  # Spring Boot detects the image and sends OTLP traces, metrics and logs to it automatically.
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    environment:
      PROMETHEUS_EXTRA_ARGS: --enable-feature=created-timestamp-zero-ingestion
    volumes:
      # PowerBank dashboard and alert rules (observability/grafana), loaded on every start
      - ./observability/grafana/provisioning/dashboards/powerbank.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/powerbank.yaml:ro
      - ./observability/grafana/provisioning/alerting/powerbank.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/powerbank.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/powerbank-dashboards:ro
  # later for stage 9: hashicorp/vault in dev mode

volumes:
  postgres-data:
  temporal-data:
